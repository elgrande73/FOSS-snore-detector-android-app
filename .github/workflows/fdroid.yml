{"name":"F-Droid Build Test","on":{"push":{},"pull_request":{},"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"fdroid":{"runs-on":"ubuntu-24.04","steps":[{"name":"Checkout application","uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"name":"Set up Java 17","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Set up Python 3.12","uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Run normal Gradle release build","run":"chmod +x ./gradlew && ./gradlew clean assembleRelease --no-daemon"},{"name":"Clone F-Droid Server","run":"git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git "$RUNNER_TEMP/fdroidserver""},{"name":"Install F-Droid Server","run":"python -m venv "$RUNNER_TEMP/fdroid-venv" && "$RUNNER_TEMP/fdroid-venv/bin/python" -m pip install --upgrade pip && "$RUNNER_TEMP/fdroid-venv/bin/python" -m pip install -e "$RUNNER_TEMP/fdroidserver""},{"name":"Verify F-Droid Server","run":""$RUNNER_TEMP/fdroid-venv/bin/fdroid" --version"},{"name":"Create F-Droid data directory","run":"mkdir -p "$RUNNER_TEMP/fdroiddata/metadata" "$RUNNER_TEMP/fdroiddata/srclibs" "$RUNNER_TEMP/fdroiddata/tmp""},{"name":"Create F-Droid metadata","working-directory":"${{ runner.temp }}/fdroiddata","run":"cat > metadata/com.aistudio.snoredetector.afkwd.yml <<'EOF'\nCategories:\n - Health\n\nLicense: Apache-2.0\n\nAutoName: Snore Detector\n\nRepoType: git\nRepo: https://github.com/elgrande73/FOSS-snore-detector-android-app.git\n\nBuilds:\n - versionName: "1.0.0"\n versionCode: 1\n commit: v1.0.0\n subdir: app\n gradle:\n - yes\nEOF"},{"name":"Read F-Droid metadata","working-directory":"${{ runner.temp }}/fdroiddata","run":""$RUNNER_TEMP/fdroid-venv/bin/fdroid" readmeta"},{"name":"Lint F-Droid metadata","working-directory":"${{ runner.temp }}/fdroiddata","run":""$RUNNER_TEMP/fdroid-venv/bin/fdroid" lint com.aistudio.snoredetector.afkwd"},{"name":"Build with F-Droid","working-directory":"${{ runner.temp }}/fdroiddata","run":""$RUNNER_TEMP/fdroid-venv/bin/fdroid" build com.aistudio.snoredetector.afkwd"},{"name":"Upload F-Droid build logs","if":"always()","uses":"actions/upload-artifact@v4","with":{"name":"fdroid-build-logs","path":"${{ runner.temp }}/fdroiddata/log/","if-no-files-found":"ignore"}}]}}}
