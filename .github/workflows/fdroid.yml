{"name":"F-Droid Build Test","on":{"push":{}},"jobs":{"test":{"runs-on":"ubuntu-24.04","steps":[{"name":"Checkout","uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"name":"Set up Java 17","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Build Release","run":"chmod +x ./gradlew && ./gradlew clean assembleRelease --no-daemon"},{"name":"Set up Python 3.12","uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Clone F-Droid Server","run":"git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git "$RUNNER_TEMP/fdroidserver""},{"name":"Install F-Droid Server","run":"python -m venv "$RUNNER_TEMP/fdroid-venv" && "$RUNNER_TEMP/fdroid-venv/bin/python" -m pip install --upgrade pip && "$RUNNER_TEMP/fdroid-venv/bin/python" -m pip install -e "$RUNNER_TEMP/fdroidserver""},{"name":"Verify F-Droid Server","run":""$RUNNER_TEMP/fdroid-venv/bin/fdroid" --version"}]}}}
