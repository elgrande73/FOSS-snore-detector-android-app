name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests and lint
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest lintDebug --no-daemon

      # Room rewrites app/schemas during the build, so a difference here means the database
      # changed without committing the schema (and adding a migration).
      - name: Check the exported Room schema
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --short -- app/schemas
            git diff -- app/schemas
            echo "::error::The Room schema changed. Bump the database version, add a migration and commit app/schemas."
            exit 1
          fi
